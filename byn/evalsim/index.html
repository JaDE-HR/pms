<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>평가 셋업 검증</title>
<style>
body{margin:0;font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;background:#f4f6f8;color:#1f2a33;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border:1px solid #e1e6ea;border-radius:12px;padding:34px 34px 28px;width:340px;box-shadow:0 10px 30px rgba(20,40,60,.06)}
h1{font-size:18px;margin:0 0 6px}p{font-size:13px;color:#6b7782;margin:0 0 18px;line-height:1.6}
input{width:100%;box-sizing:border-box;height:40px;border:1px solid #cfd6dc;border-radius:8px;padding:0 12px;font-size:14px}
button{margin-top:12px;width:100%;height:40px;border:0;border-radius:8px;background:#1e5fb4;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.err{color:#c0392b;font-size:12.5px;min-height:18px;margin-top:8px}
</style></head>
<body>
<form class="box" id="f" onsubmit="go();return false;">
  <h1>평가 셋업 검증</h1>
  <p>2026년 하반기 정기평가 세팅값과 동작을 확인하는 페이지입니다.<br>현황판 열람 비밀번호를 입력하세요.</p>
  <input type="password" id="pw" placeholder="비밀번호" autofocus>
  <button type="submit">열기</button>
  <div class="err" id="err"></div>
</form>
<script>
function go(){
  var pw=document.getElementById('pw').value, er=document.getElementById('err'); er.textContent='';
  fetch('site.enc?v='+Date.now()).then(function(r){return r.arrayBuffer();}).then(function(buf){
    var b=new Uint8Array(buf), magic=String.fromCharCode.apply(null,b.slice(0,5));
    if(magic!=='JPMS1') throw new Error('fmt');
    var iter=new DataView(buf,5,4).getUint32(0), salt=b.slice(9,25), iv=b.slice(25,37), body=b.slice(37);
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,body);});
  }).then(function(plain){
    var html=new TextDecoder().decode(plain); document.open(); document.write(html); document.close();
  }).catch(function(){ er.textContent='비밀번호가 맞지 않습니다.'; });
}
</script>
</body></html>
