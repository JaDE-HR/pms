<!-- ══════════════════════════════════════════════════════════════
     이 파일에서 고칠 것은 <title> 한 줄뿐입니다.

     데이터는 같은 폴더의 data.enc 에서 읽습니다.
     화면에 나오는 모든 것(고객사명·로고·기간·진척률·탭 구성)이 그 안에 있습니다.

     ── 갱신 절차 ───────────────────────────────────────────
       1. data.xlsx 를 엑셀에서 고친다        (이 파일은 커밋되지 않습니다)
       2. python _tools/pack.py isens         → data.enc 재생성
       3. git add . && git commit && git push

     ── 새 프로젝트 ─────────────────────────────────────────
       1. 이 폴더를 통째로 복사하고 폴더명을 프로젝트키로 바꾼다
       2. <title> 을 고친다
       3. data.xlsx 를 그 프로젝트 내용으로 채운다
       4. python _tools/pack.py <프로젝트키>
       5. 커밋한다

     ── 선택 항목 ───────────────────────────────────────────
       공개해도 되는 현황판이면 암호화 없이 쓸 수 있습니다.
       <script>window.BOARD = { plain:true };</script>
       → 잠금 화면 없이 같은 폴더의 data.xlsx 를 그대로 읽습니다.
         (이때는 .gitignore 에서 그 프로젝트의 data.xlsx 를 빼주세요)
     ══════════════════════════════════════════════════════════════ -->
