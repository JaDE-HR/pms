function b64(s){var r=atob(s),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function fail(m){var e=document.getElementById('err');e.textContent=m;
  document.getElementById('go').disabled=false;}
async function unlock(pw, quiet){
  if(!pw){ if(!quiet) fail('비밀번호를 입력해 주세요.'); return false; }
  if(!(window.crypto&&crypto.subtle)){
    fail('이 브라우저에서는 복호화를 지원하지 않습니다(https 로 접속했는지 확인).'); return false; }
  document.getElementById('go').disabled=true;
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
    savePw(pw);
    var doc=new TextDecoder('utf-8').decode(pt);
    document.open(); document.write(doc); document.close();
    return true;
  }catch(e){
    /* 🔴 실패해도 보관함을 비우지 않는다 — 슬롯이 번들 공용이라, 고객 비밀번호로
       작성 중 문서를 열어보는 순간 지워버리면 나머지 검토서까지 다시 물어야 한다. */
    if(!quiet) fail('비밀번호가 올바르지 않습니다.');
    document.getElementById('go').disabled=false;
    return false;
  }
}
document.getElementById('go').addEventListener('click',function(){
  unlock(document.getElementById('pw').value,false); });
document.getElementById('pw').addEventListener('keydown',function(ev){
  if(ev.key==='Enter'){ ev.preventDefault(); unlock(this.value,false); } });
/* 비밀번호 보관함 — 한 번 통과한 비밀번호를 모아 두고, 다음 페이지에서 조용히 다시 시도한다.
   ⇒ 브라우저당 **한 번만** 입력하면 번들 전체가 열린다.
   관리자·고객 비밀번호가 섞여 있어도 되도록 **목록**으로 둔다 — 맞는 것 하나가 열면 된다.

   🔴 **localStorage 를 먼저 쓴다** — 목업 링크가 `target="_blank" rel="noopener"` 라
      **새 창이 sessionStorage 를 물려받지 못한다**(noopener = 새 최상위 컨텍스트).
      sessionStorage 만 쓰면 검토서에서 비밀번호를 넣어도 **목업에서 또 묻는다**(실측 2026-08-05).
      sessionStorage 는 localStorage 가 막힌 환경(사생활 보호 모드 등)용 폴백으로 남긴다. */
function stores(){ var a=[];
  try{ if(window.localStorage) a.push(localStorage); }catch(e){}
  try{ if(window.sessionStorage) a.push(sessionStorage); }catch(e){}
  return a; }
function readPws(){ var out=[];
  stores().forEach(function(s){ try{ var a=JSON.parse(s.getItem(KEY)||'[]');
    if(Array.isArray(a)) a.forEach(function(p){ if(out.indexOf(p)<0) out.push(p); });
  }catch(e){} }); return out; }
function savePw(pw){
  stores().forEach(function(s){ try{ var a=JSON.parse(s.getItem(KEY)||'[]');
    if(!Array.isArray(a)) a=[];
    if(a.indexOf(pw)<0){ a.push(pw); s.setItem(KEY,JSON.stringify(a)); }
  }catch(e){} }); }
(async function(){ var a=readPws();
  for(var i=0;i<a.length;i++){ if(await unlock(a[i],true)) return; }
  document.getElementById('go').disabled=false; })();
</script>
