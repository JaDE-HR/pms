<div class="box">
  <h1>아직 작성 중인 문서입니다</h1>
  <p><b>연차수당 데이터 회계 연계 (API)</b><br>BYN 차세대 인사시스템 구축 · 요구사항 검토서</p>
  <p class="lead">이 문서는 <b>아직 작성이 끝나지 않아</b> 임시로 잠가 둔 것입니다. 내용이 바뀔 수 있어 지금 보시면 혼선이 생길 수 있습니다.<br><b>완성되면 담당자가 안내드립니다.</b><br>지금 확인이 필요하시면 담당자에게 문의해 주세요.</p>

    <input type="password" id="pw" placeholder="비밀번호" autocomplete="off" autofocus>
    <button id="go" type="button">확인</button>
